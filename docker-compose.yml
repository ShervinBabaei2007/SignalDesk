services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # SQLite persisted in a named volume. For Postgres, point this at the db service below.
      DATABASE_URL: sqlite:////data/signaldesk.db
    volumes:
      - signaldesk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  signaldesk-data:
